[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "open-report-designer"
description = "Open Report Designer: one typed report document to PDF, HTML and Word."
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
dynamic = ["version"]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/African-River-Corridors/open-report-designer"

[tool.maturin]
python-source = "python"
module-name = "ord_report._ord"
features = ["extension-module"]
