name: Release

# On a version tag: render the example report in all three formats with the `ord` program and attach them,
# with the schema, to the GitHub release. The release notes are the version's CHANGELOG section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The tag is the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}" >&2; exit 1; }
      - name: Build ord
        run: cargo build --locked --release -p ord-cli
      - name: Render the examples
        run: |
          target/release/ord render examples/screening-report.json --format all -o dist
          cp schema/ord-document.schema.json dist/
          ls -l dist
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > dist/notes.md <<'PY'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(sys.argv[1])}\b.*?\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no section for {sys.argv[1]}")
          print(m.group(1).strip())
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file dist/notes.md \
            dist/screening-report.pdf dist/screening-report.html dist/screening-report.docx \
            dist/ord-document.schema.json
