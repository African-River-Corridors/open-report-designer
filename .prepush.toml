# arc-prepush: the pre-push hook (tool in African-River-Corridors/workflows).
# Format and lint run on the files a push changes (ruff from uv.lock; cargo fmt on changed
# crates). The release guard runs too: CI gates on it and AGENTS.md asks for it before every
# push. Its --history mode reads every local branch, as CI reads every pushed one.

[[check]]
name = "release guard (tree)"
run = ["python3", "tools/release_guard.py"]

[[check]]
name = "release guard (history)"
run = ["python3", "tools/release_guard.py", "--history"]
